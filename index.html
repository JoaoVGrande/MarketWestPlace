<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riftbound Marketplace</title>
    <!-- Framework Tailwind para estilização rápida -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Arquivo CSS para estilos que o Tailwind não cobrir (se precisar no futuro) -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Configuração de cores customizadas do Tailwind para o tema do jogo -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        rift: {
                            dark: '#0f172a',
                            panel: '#1e293b',
                            primary: '#8b5cf6',
                            accent: '#c084fc'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-rift-dark text-gray-100 font-sans antialiased min-h-screen flex flex-col">

    <!-- Cabeçalho com Logo e Perfil Pré-carregado -->
    <header class="bg-rift-panel border-b border-gray-700 shadow-lg">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-rift-primary to-rift-accent tracking-wider">
                RIFTBOUND<span class="text-gray-100 font-light">Market</span>
            </h1>
            
            <!-- Perfil Logado Mockado -->
            <div class="flex items-center space-x-3 bg-gray-800 px-4 py-2 rounded-full border border-gray-700 shadow-inner">
                <img src="https://ui-avatars.com/api/?name=Mestre+Do+Portal&background=8b5cf6&color=fff&bold=true" alt="Avatar do Jogador" class="w-8 h-8 rounded-full border border-rift-primary">
                <span class="font-medium text-sm text-gray-200">@MestreDoPortal</span>
                <!-- Bolinha verde simulando "Online" -->
                <span class="w-2.5 h-2.5 bg-green-500 rounded-full inline-block shadow-[0_0_8px_rgba(34,197,94,0.8)]"></span>
            </div>
        </div>
    </header>

    <!-- Navegação das Abas -->
    <nav class="bg-rift-panel/80 sticky top-0 backdrop-blur-md z-10 border-b border-gray-800">
        <div class="container mx-auto px-4 flex space-x-2 overflow-x-auto hide-scrollbar">
            <button data-target="noticias" class="tab-btn active px-6 py-4 text-sm font-bold border-b-2 border-rift-primary text-rift-accent whitespace-nowrap hover:bg-gray-700/30 transition-colors">
                Últimas Notícias
            </button>
            <button data-target="colecao" class="tab-btn px-6 py-4 text-sm font-medium border-b-2 border-transparent text-gray-400 hover:text-gray-200 hover:border-gray-500 whitespace-nowrap hover:bg-gray-700/30 transition-colors">
                Minha Coleção
            </button>
            <button data-target="vitrine" class="tab-btn px-6 py-4 text-sm font-medium border-b-2 border-transparent text-gray-400 hover:text-gray-200 hover:border-gray-500 whitespace-nowrap hover:bg-gray-700/30 transition-colors">
                Minha Vitrine
            </button>
            <button data-target="lojas" class="tab-btn px-6 py-4 text-sm font-medium border-b-2 border-transparent text-gray-400 hover:text-gray-200 hover:border-gray-500 whitespace-nowrap hover:bg-gray-700/30 transition-colors">
                Lojas Parceiras
            </button>
        </div>
    </nav>

    <!-- Conteúdo Principal -->
    <main class="container mx-auto px-4 py-8 flex-grow">
        
        <!-- Aba: Últimas Notícias -->
        <section id="noticias" class="tab-content block">
            <h2 class="text-3xl font-bold mb-6 text-gray-100 border-l-4 border-rift-primary pl-4">Últimas Notícias de Riftbound</h2>
            <!-- Container onde o JS vai renderizar as notícias -->
            <div id="noticias-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Vazio propositalmente -->
            </div>
        </section>

       <!-- Aba: Minha Coleção -->
        <section id="colecao" class="tab-content hidden">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                <h2 class="text-3xl font-bold text-gray-100 border-l-4 border-rift-primary pl-4">Minha Coleção</h2>
                
                <!-- Botões de controle de edição -->
                <div class="flex space-x-3 w-full md:w-auto justify-end">
                    <button id="btn-salvar-colecao" class="hidden bg-green-600 hover:bg-green-500 text-white px-5 py-2 rounded-lg font-bold transition-all shadow-[0_0_10px_rgba(22,163,74,0.4)] disabled:opacity-50 disabled:cursor-not-allowed">
                        Salvar Mudanças
                    </button>
                    <button id="btn-editar-colecao" class="bg-gray-700 hover:bg-gray-600 text-white px-5 py-2 rounded-lg font-bold transition-all border border-gray-600">
                        Editar
                    </button>
                </div>
            </div>

            <!-- BARRA DE PESQUISA E FILTROS -->
            <div class="bg-gray-800 p-4 rounded-lg border border-gray-700 mb-6 flex flex-col md:flex-row gap-4 items-center justify-between">
                <div class="w-full md:w-1/2">
                    <input type="text" id="busca-nome" placeholder="Buscar carta por nome..." class="w-full bg-gray-900 border border-gray-600 rounded-lg px-4 py-2.5 text-gray-200 focus:outline-none focus:border-rift-primary transition-colors placeholder-gray-500">
                </div>
                <div class="w-full md:w-auto min-w-[250px]">
                    <select id="filtro-quantidade" class="w-full bg-gray-900 border border-gray-600 rounded-lg px-4 py-2.5 text-gray-200 focus:outline-none focus:border-rift-primary transition-colors cursor-pointer">
                        <option value="todas">Mostrar Todas</option>
                        <option value="possuidas">Esconder cartas zeradas (Que eu tenho)</option>
                        <option value="faltantes">Mostrar apenas zeradas (Faltantes)</option>
                    </select>
                </div>
            </div>
            
            <!-- Container onde o JS vai renderizar as cartas que você possui -->
            <div id="colecao-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
                <!-- Vazio propositalmente -->
            </div>
        </section>

        <!-- Aba: Minha Vitrine (Cartas sendo vendidas) -->
        <section id="vitrine" class="tab-content hidden">
            <div class="flex justify-between items-end mb-6">
                <h2 class="text-3xl font-bold text-gray-100 border-l-4 border-rift-primary pl-4">Minha Vitrine</h2>
                <button class="bg-rift-primary hover:bg-purple-500 text-white px-5 py-2.5 rounded-lg font-bold transition-all shadow-[0_0_15px_rgba(139,92,246,0.4)] hover:shadow-[0_0_25px_rgba(139,92,246,0.6)]">
                    + Vender Carta
                </button>
            </div>
            <!-- Container onde o JS vai renderizar as cartas à venda -->
            <div id="vitrine-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
                <!-- Vazio propositalmente -->
            </div>
        </section>

        <!-- Aba: Lojas Parceiras -->
        <section id="lojas" class="tab-content hidden">
            <h2 class="text-3xl font-bold mb-6 text-gray-100 border-l-4 border-rift-primary pl-4">Lojas Parceiras</h2>
            <!-- Container onde o JS vai renderizar os banners/links das lojas -->
            <div id="lojas-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Vazio propositalmente -->
            </div>
        </section>

    </main>

    <footer class="bg-rift-panel border-t border-gray-800 mt-auto py-6 text-center text-gray-500 text-sm">
        <p>&copy; 2026 Riftbound Marketplace. Protótipo em Desenvolvimento.</p>
    </footer>

    <!-- O "type=module" é crucial para que você possa usar 'import' e 'export' nos seus arquivos JS -->
    <script type="module" src="js/main.js"></script>
    
    <!-- Script inline básico APENAS para gerenciar o CSS das abas (pode mover para o ui.js depois) -->
    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</body>
</html>
